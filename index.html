<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Proposal</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }.card {
  background: white;
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  animation: fadeIn 2s ease;
}

h1 {
  color: #ff4d6d;
  font-size: 2.5rem;
}

p {
  font-size: 1.2rem;
  color: #333;
  margin: 20px 0;
}

button {
  padding: 12px 25px;
  border: none;
  border-radius: 25px;
  background: #ff4d6d;
  color: white;
  font-size: 1rem;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #e63950;
}

.heart {
  position: absolute;
  color: red;
  animation: float 5s linear infinite;
}

@keyframes float {
  0% {
    transform: translateY(100vh) scale(0);
    opacity: 1;
  }
  100% {
    transform: translateY(-10vh) scale(1);
    opacity: 0;
  }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

  </style>
</head>
<body><div class="card">
  <h1>Neelu Ji ❤️</h1>
  <p>
    From the moment I met you, my world changed in the most beautiful way.
    Your smile makes my day brighter and your presence makes everything better.
  </p>
  <p>
    I don't know what the future holds, but I know one thing for sure...
  </p>
  <h2>Will you be mine? 💖</h2>
  <button onclick="showLove()">Yes</button>
  <button onclick="showno()">No</button>
</div><script>
  function showLove() {
    alert("I Love You Most❤️");
  }
  function showno() {
    alert("Fuck You😡");
  }

  function createHeart() {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.innerHTML = '❤️';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.fontSize = Math.random() * 20 + 10 + 'px';
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 5000);
  }

  setInterval(createHeart, 300);
</script></body>
</html>
